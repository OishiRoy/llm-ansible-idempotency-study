---
- name: Install cron and ensure service is running
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Ensure cron package is installed
      ansible.builtin.apt:
        name: cron
        state: present
        update_cache: true

    - name: Ensure cron service is running
      ansible.builtin.service:
        name: cron
        state: started