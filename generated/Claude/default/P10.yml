---
- name: Ensure the line APP_MODE=production exists in /etc/myapp/app.conf
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Ensure /etc/myapp directory exists
      ansible.builtin.file:
        path: /etc/myapp
        state: directory
        mode: '0755'

    - name: Ensure APP_MODE=production line exists in app.conf
      ansible.builtin.lineinfile:
        path: /etc/myapp/app.conf
        regexp: '^APP_MODE='
        line: 'APP_MODE=production'
        create: true
        mode: '0644'