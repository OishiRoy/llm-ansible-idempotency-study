---
- name: Ensure the contents of /tmp/myapp.tar.gz are extracted into /opt/app
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Ensure /opt/app directory exists
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Extract /tmp/myapp.tar.gz into /opt/app
      ansible.builtin.unarchive:
        src: /tmp/myapp.tar.gz
        dest: /opt/app
        remote_src: true