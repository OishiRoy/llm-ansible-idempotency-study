---
- name: Ensure /etc/myapp/app.conf contains required configuration block
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Ensure /etc/myapp directory exists
      ansible.builtin.file:
        path: /etc/myapp
        state: directory
        mode: '0755'

    - name: Ensure app.conf file exists
      ansible.builtin.file:
        path: /etc/myapp/app.conf
        state: touch
        mode: '0644'
        access_time: preserve
        modification_time: preserve

    - name: Ensure setting1=value1 is present
      ansible.builtin.lineinfile:
        path: /etc/myapp/app.conf
        regexp: '^setting1='
        line: 'setting1=value1'
        state: present

    - name: Ensure setting2=value2 is present
      ansible.builtin.lineinfile:
        path: /etc/myapp/app.conf
        regexp: '^setting2='
        line: 'setting2=value2'
        state: present
