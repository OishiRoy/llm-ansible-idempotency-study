--- 

- name: Install cron and ensure service is running on Ubuntu 22.04 

  hosts: localhost 

  connection: local 

  become: true 

 

  tasks: 

    - name: Install cron package 

      ansible.builtin.apt: 

        name: cron 

        state: present 

        update_cache: yes 

 

    - name: Ensure cron service is running 

      ansible.builtin.service: 

        name: cron 

        state: started