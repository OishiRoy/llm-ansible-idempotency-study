---
- name: Configure Nginx worker_connections and restart on change
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Ensure worker_connections is set to 1024
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^\s*worker_connections\s+\d+\s*;$'
        line: '    worker_connections 1024;'
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted